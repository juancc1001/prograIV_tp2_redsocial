<main class="feed">
  <label class="sort">
    <mat-icon>sort</mat-icon>
    <select #sortSelect (change)="changeSort(sortSelect.value)">
      <option value="recent">Más recientes</option>
      <option value="likes">Más gustados</option>
    </select>
  </label>
  @for (post of posts(); track post.id) {
    <app-post-card [post]="post" (deleted)="removePost($event)" />
  }
  @if (hasMore()) {
    <button type="button" class="more" (click)="loadPosts()">Cargar más</button>
  }
</main>
