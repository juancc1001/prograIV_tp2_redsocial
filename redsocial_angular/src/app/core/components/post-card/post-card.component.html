<article class="card">
  <header class="header">
    <div>
      <h3 class="title">{{ post.title }}</h3>
      <span class="date">{{ post.createdAt | date: 'dd/MM/yyyy HH:mm' }}</span>
    </div>
    @if (post.author; as author) {
      <div class="author">
        <span>{{ author.username }}</span>
        <div class="avatar">
          @if (author.profilePictureUrl) {
            <img [src]="author.profilePictureUrl">
          } @else {
            <mat-icon>person</mat-icon>
          }
        </div>
      </div>
    }
  </header>
  <a [routerLink]="['/post', post.id]">
    <img #photo class="photo" [src]="post.imageUrl" [alt]="post.title">
  </a>
  <p #description class="description" [class.clamped]="!expanded()">{{ post.description }}</p>
  @if (isLong() && !expanded()) {
    <button type="button" class="more" (click)="expanded.set(true)">ver más...</button>
  }
  <div class="stats">
    <button type="button" class="like" (click)="toggleLike()">
      <mat-icon>{{ liked() ? 'favorite' : 'favorite_border' }}</mat-icon> {{ likesCount() }}
    </button>
    <span><mat-icon>chat_bubble_outline</mat-icon> {{ post.commentsCount }}</span>
    <button type="button" class="fullscreen" (click)="openFullscreen()">
      <mat-icon>fullscreen</mat-icon>
    </button>
    @if (isOwner()) {
      <button type="button" class="delete" (click)="deletePost()">
        <mat-icon>delete</mat-icon>
      </button>
    }
  </div>
</article>
