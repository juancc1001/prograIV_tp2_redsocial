<header class="navbar">
  <a class="brand" routerLink="/">
    <img src="assets/logo.png" width="34" height="34">
    <span class="brand-name">SlugChat</span>
  </a>
  <nav class="links">
    <a>Seguidos</a>
    <a>Explorar</a>
  </nav>
  <div class="search">
    <mat-icon>search</mat-icon>
    <div class="search-text">Buscá personas, lugares o tags</div>
  </div>
  <div class="actions">
    <div class="icon-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    </div>
    <span class="new-frame">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E0B1F" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Nuevo frame
    </span>
    <div class="settings">
      <button class="icon-btn" (click)="menuOpen.set(!menuOpen())"><mat-icon>settings</mat-icon></button>
      @if (menuOpen()) {
        <div class="menu">
          <button>Editar perfil</button>
          <button (click)="logout()">Cerrar sesión</button>
        </div>
      }
    </div>
    <a class="avatar" [routerLink]="authService.username() ? ['/', authService.username()] : '/login'"><mat-icon>person</mat-icon></a>
  </div>
</header>
